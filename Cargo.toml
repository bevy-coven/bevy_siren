[package]
name = "bevy_siren"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Sound for Bevy games: a cue table as data, buses that duck, a voice budget, layered music on the bar, and a log of what played and why."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bevy-coven/bevy_siren"
keywords = ["bevy", "gamedev", "audio", "sound", "music"]
categories = ["game-development", "multimedia::audio"]
# `docs/` holds the still, the GIF and the research notes, so it is out of the package; the README is
# anchored so `docs/guide/` and `docs/media/` READMEs (relative links, for GitHub) stay out too.
include = ["src/**", "Cargo.toml", "/README.md", "LICENSE-*"]
# Every file in `tests/` is a module of `tests/all.rs`: one test executable, so Bevy is linked once.
# `every_test_file_is_a_module` fails on an undeclared file.
autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

# The voice-budget evidence harness. It proves a `MixerVoice` frees its slot when its sample ends, which needs the
# crate's own mixer to exist, so it is built only with that feature — `cargo build --examples` stays green without it.
[[example]]
name = "budget"
required-features = ["mixer"]

# #36's throughput bench is a separate example from `perfcheck` on purpose: a per-frame cost and a batch job must never
# be read as the same number.
[[example]]
name = "indexbench"
required-features = ["semantic"]

[features]
default = []
# `serde` on the cue table, the mix table and the music score, plus `from_ron`/`to_ron`: a project saves
# them as data and the Cauldron edits them in `<project>/family/bevy_siren.ron`.
serde = ["dep:serde", "dep:ron"]
# Our own mixer on rodio: true per-bus summing, where a bus's gain is one number the frame writes.
# Without it the crate plays through Bevy's `AudioPlayer` and applies bus gain per voice.
mixer = ["dep:rodio"]
# Nothing enables this in normal use. `tests/readme.rs` checks the README's quick start against the
# crate-root doctest, so the two cannot drift.
readme-example = []
# Semantic selection: describe a sound in words, get candidates back, and find the sounds that fit a chosen one.
# Off by default; a user who does not enable it sees no change at all, in the dependency graph or in the binary
# (`tests/library.rs::the_semantic_feature_declares_no_dependency_of_its_own` used to pin the empty case and now
# pins that the only entry is the inference runtime).
#
# `ort` is the inference runtime ADR 0002 chose, and it needs **two** features: `download-binaries` fetches ONNX
# Runtime 1.31 at build time, and `tls-rustls` is what lets the build script make that request. With only the first,
# `ort-sys` fails with "a TLS feature must be configured"; with neither, the crate builds and fails to link.
#
# `rodio` is here because the feature must **decode**, and the crate already has a decoder it trusts: the one the mixer
# uses. Reusing it means an asset that plays is the same asset that indexes, and it brings no new dependency — only the
# one the `mixer` feature already enables.
semantic = ["dep:ort", "dep:rodio", "dep:rubato", "dep:ebur128"]

[dependencies]
# The umbrella with defaults off. A game already has the full `bevy`, so these features cost it nothing;
# `cargo build` compiles exactly this list, which is the check that a consumer's build works.
#
# `bevy_time` and `bevy_transform` are deliberately absent: measured in `bevy_internal-0.20.0/Cargo.toml`,
# both are non-optional dependencies, so `Time<Real>` and `GlobalTransform` need no feature. Naming one
# would be a hard error, not a no-op.
bevy = { version = "0.20.0", default-features = false, features = [
    "bevy_asset", # Handle<AudioSource> in SirenSounds
    "bevy_audio", # AudioPlayer, PlaybackSettings, AudioSink
    "bevy_log",   # warn! for a cue table that fails its own checks
    "std",
] }
# The inference runtime ADR 0002 chose, measured in `runs/2026-11-03-63/evidence/ort-probe.txt`: it builds in 8 s on
# macOS arm64, loads the 501 MB CLAP text graph, reports its dynamic axes, and returns a unit-norm embedding. It is
# behind `semantic` and off by default, so `cargo build` still compiles the four dependencies it always did.
ort = { version = "=2.0.0-rc.15", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries", # fetches ONNX Runtime 1.31; without it the crate builds and fails to link
    "tls-rustls",        # what lets the build script fetch it; without it ort-sys cannot compile
], optional = true }
# The resampler. `needs-decision/resampler-dependency.md` measured the three candidates: `rodio`'s converter discards
# samples when down-sampling (its own doc comment), a hand-rolled interpolator produces a plausible embedding from a
# corrupted signal, and `rubato`'s FFT resampler keeps a 1 kHz tone at 0.9763 of its energy with 15 kHz intact
# (`runs/2026-11-03-63/evidence/resampler-probe.txt`). Pure Rust, so no C toolchain and no download.
rubato = { version = "0.16", default-features = false, features = ["fft_resampler"], optional = true }
# Loudness and true peak, per BS.1770 / EBU R128. ADR 0003 selected it after verifying it is **pure Rust**: with
# `default-features = false` there is no `cc`, no C source compiled, and its `c-tests` feature — which exists to build
# the reference C for conformance comparison — stays off. Measured: a clean build takes 1.66 s and produces no C object.
# It agrees with `ffmpeg`'s reference to 0.01 LU on every clip long enough to have a gating block.
ebur128 = { version = "0.1.11", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
ron = { version = "0.12", optional = true }
# The `mixer` backend only. Same version as `bevy_audio`'s own, so the graph has one rodio.
#
# `wav` and `vorbis` are the two formats a game's sounds arrive in — WAV for effects, Vorbis for music,
# which is also Bevy's default audio format — and `Decoder::new` returns `UnrecognizedFormat` for
# anything else, which the backend warns about rather than panicking on. Enabling them here rather than
# relying on the game's `bevy/wav` keeps the backend's promises its own.
rodio = { version = "0.22", default-features = false, features = ["playback", "wav", "vorbis"], optional = true }

# **Tests and examples only.** `wav` is the format the examples synthesise, and the full umbrella here
# cannot reach a consumer's dependency graph. `tests/leaf.rs` reads `[dependencies]` only, deliberately.
[dev-dependencies]
bevy = { version = "0.20.0", features = ["wav"] }
ron = "0.12"
