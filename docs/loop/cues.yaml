    source: "Gregory, Game Engine Architecture 3e §14.5.8 — `\"a virtual voice is a sound the game believes is playing but that has no hardware voice\"`"
    evidence: "runs/2026-11-03-44/review.md, tests/music.rs::a_refused_layer_start_is_tried_again_when_room_frees"

  - id: 34
    cue: track.combat
    authored: { mode: Loop, mixer: true, gain: "0.0 on pass 1, 1.0 on pass 2, 0.25 on pass 3" }
    behaviour: A looping voice on the crate's own mixer plays at the gain in force when each sample is pulled — on the first pass, on every later pass, and on the next sample after the gain is written.
    observed_by: "The samples a `rodio::Player` on a bus `Mixer` produces, pulled offline across three wraps of a loop longer than one 32 768-sample span; and a two-stem score rendered through the real `Decoder`."
    green_when: "Every sample is the sample × the gain stored before it was pulled (worst difference 0.000000 on every pass); a layer decoded silent is audible on pass 2; a gain stored between two samples is on the next one (0 samples late)."
    source: "Khan et al. 2023, arXiv:2303.15734 (adaptive music is per-instrument gain keyed to game state); crate rule R6. `rodio-0.22.2/src/source/{repeat,buffered}.rs`: `repeat_infinite` stores what it is given."
    evidence: "runs/2026-11-03-114/review.md, src/mixer/mod.rs::tests::{a_looping_voice_follows_its_gain_on_every_pass, a_gain_stored_between_two_samples_is_on_the_next_one, a_looping_voice_through_a_player_and_a_bus_mixer_follows_its_gain} (red on the unfixed order)"

  - id: 35
    cue: track.combat
    authored: { mode: Loop, sound: "an Ogg Vorbis file", backend: "the crate's mixer, and Bevy's AudioPlayer" }
    behaviour: A looping voice of an Ogg Vorbis file sounds until it is stopped, on the crate's own mixer and on Bevy's path — it is not an empty source that `Played` has already announced.
    observed_by: "`decoder.repeat_infinite()` over the real `tone.ogg`, `tone-441.ogg`, `tone.flac` and `tone.mp3` through the Vorbis decoder `rodio` has in this build, counted; a loop of the real `tone-441.ogg` on the real `MixerBackend`, asked three passes later whether it is finished; and a source that starts with an empty span, through the mixer's own `looped`."
    green_when: "`repeat_infinite` yields every sample asked of it on all four files (147 456 of 147 456 for `tone.ogg`; it yielded **0 of 147 456** on the `symphonia` Vorbis backend); the real mixer's Ogg voice is not finished 350 ms into a 0.1 s loop; a source whose first span is empty still loops, trimmed or not."
    source: "`rodio-0.22.2/src/source/buffered.rs:104` reads a span of `Some(0)` as an empty source and `decoder/symphonia.rs:163` reports one before the first sample (RustAudio/rodio#775, open). Bevy's 0.18 → 0.19 migration guide: OGG/VORBIS through `symphonia` is *\"subject to issues with buffering, reverb, looping and spatial audio\"*. Bevy's own loop is `decoder.repeat_infinite()` (`bevy_audio-0.20.1/src/audio_output.rs:165`)."
    evidence: "runs/2026-11-03-115/review.md, tests/ogg_loops.rs::the_duration_plays_exactly_the_streams_length_through_rodio_itself (red on `vorbis`, green on `lewton`), tests/mixer.rs::an_ogg_loop_on_the_real_mixer_sounds_until_it_is_stopped (red without `OpenSpan`), src/mixer/mod.rs::tests::a_loop_whose_decoder_starts_with_an_empty_span_still_loops"

  - id: 36
    cue: track.combat
    authored: { mode: Loop, sound: "an Ogg Vorbis file", declared_frames: 24000, decoder_returns: 24576 }
    behaviour: A loop of an Ogg Vorbis file is as long as the stream declares — its last page's granule position — so a stem stays on its bar and nothing sits between two passes.
    observed_by: "The period of four passes of the real `tone.ogg` through Bevy's decoder call (`decoder.take_duration(d).repeat_infinite()`) before and after, with the near-silent run at the first wrap and its spectrogram; every `.ogg` of Kenney's CC0 library (254) decoded with the trim and counted; `rodio`'s own `TakeDuration` over a grid of rates and channel counts; and the mixer's `looped` pulled through a real `Player`."
    green_when: "Period exactly 24 000 frames where it was 24 576 (12.00 ms late); a near-silent run at the first wrap of 0 frames where it was 563 (11.7 ms); 254 of 254 real files decode to exactly their declared samples (51 returned more, 27 to 936 frames, a padding peak as high as −6 dBFS); the computed duration emits exactly the declared samples in 108 of 108 cells (`frames / rate` was wrong in 77, by up to 158 samples); a file the walk does not fully understand is left as it was."
    source: "Vorbis I specification A.2: the granule position of a stream's last page is its length and the excess of the last block is discarded. A gap is heard from about 3 ms (Brennan et al. 2018, DOI 10.1097/aud.0000000000000558; Penner 1977, 10.1121/1.381297; Tyler 1982, 10.1121/1.388254; Moore 1992, 10.1121/1.405240). `rodio-0.22.2/src/source/take.rs:59-126`: `TakeDuration` emits while what remains is more than `⌊10⁹ / (rate × channels)⌋` ns."
    evidence: "runs/2026-11-03-115/review.md, evidence/after/ogg-loop-report.txt and evidence/spectrograms/{tone-wrap-zoom,tone-4-passes}-{before,after}.png, tests/ogg_loops.rs, src/ogg.rs::tests, src/mixer/mod.rs::tests::{a_loop_cut_to_its_declared_length_is_that_period_with_no_padding_at_the_wrap, the_duration_it_computes_takes_exactly_the_declared_frames_at_every_rate_and_channel_count, a_trimmed_loop_through_a_player_and_a_bus_mixer_repeats_at_exactly_the_streams_length}"

  - id: 37
    cue: ui.click
    authored: { sound: "a key that names a file that failed to load (a typo in a name)", max_instances: 1, loader: "real AssetServer" }
    behaviour: A play whose file failed to load is refused with the cause, never answered `Played`; a voice spawned while the load was in flight and then failed is refused in the frame the server says so and freed; a load still in flight is not refused.
