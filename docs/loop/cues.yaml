# Two notes on judging.
#
# - A refusal is green when it is the *right* refusal. Cases 10-13 would pass vacuously if the crate refused
#   everything, so each is paired with a play that succeeds (5, 6, 14): a build that refuses too much is red there.
# - The numbers are the sources' numbers, not invented ones. 8 dB and 4 dB are Gregory's dialogue duck (Game Engine
#   Architecture 3e, 14.6.3); -6.02 dB is half amplitude; a bar at 160 bpm is 1.5 s. A case that needs a number no
#   source gives says `design default` and is argued in the iteration's research.md.

  - id: 32
    cue: engine.idle
    authored: { bus: Effects, mode: Loop, play: { on: owner, then: despawn_owner } }
    behaviour: A sound whose owner is despawned stops, and the log says which sound and why.
    observed_by: "`SirenLog`'s `Stopped` entry for the cue and `SirenMix::voices_on` after the despawn."
    green_when: "One entry whose `why` is \"owner despawned\" naming the cue; the bus counts one fewer voice; a game's own unparented despawn writes nothing."
    source: "`Play::on`'s doc — the parent's despawn is the ordinary end of such a sound; crate rule R6 — every play's outcome is readable"
    evidence: "runs/2026-11-03-43/review.md, tests/play.rs::a_despawned_owner_stops_its_sound_and_says_so, tests/mixer.rs::a_despawned_voices_mixer_slot_is_freed"

