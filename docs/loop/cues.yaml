# The cues this loop judges by.
#
# The fixed cases every iteration runs before it picks an item, and again after its change: the contract a game would
# write, in the crate's own words. Each case names the behaviour it should show, the observation that proves it, and
# how it is observed with no ear. `cues.yaml` is read by a person and, when a case is worth automating, by a test in
# `tests/cues.rs` — the fields here are the assertion.
#
# `green_when` is the assertion. `source` cites the number the case rests on, or says `design default`. A case that
# fails after a change is a failure of that iteration, whatever else it shipped.

cases:
  - id: 1
    cue: footstep.grass
    authored: { variants: 3, repeat: { avoid_repeat: 1 } }
    behaviour: Variants do not repeat back to back.
    observed_by: "64 plays, the `sound` of each `Played`."
    green_when: No two adjacent sounds are equal, and all three variants appear.

  - id: 2
    cue: footstep.stone
    authored: { variants: 2, repeat: { avoid_repeat: 4 } }
    behaviour: A window wider than the variant list still refuses the pick immediately before.
    observed_by: 8 plays.
    green_when: No two adjacent sounds are equal.

  - id: 3
    cue: gun.burst
    authored: { variants: 1, repeat: shuffle, pitch: exact }
    behaviour: A burst repeats one sample and does not vary its pitch.
    observed_by: "8 plays, `sound` and `pitch`."
    green_when: One distinct sound; every pitch equal to the authored one.

  - id: 4
    cue: footstep.grass
    authored: { pitch: { low: -1.0, high: 1.0 } }
    behaviour: Pitch jitter stays inside the authored range.
    observed_by: 64 plays.
    green_when: Every pitch in -1.0..=1.0, and at least two distinct values.

  - id: 5
    cue: ui.cancel
    authored: { gain_db: -6.0, bus: Effects, bus_gain_db: 0.0 }
    behaviour: A gain is the cue's own and its bus is the one it names.
    observed_by: "One `Played`, and `SirenMix` after it."
    green_when: gain_db == -6.0; bus == "Effects"; the mix holds the four default buses.
    source: The cue's gain is authored; 0 dB is full scale.

  - id: 6
    cue: dialogue.greeting
    authored: { bus: Dialogue, ducks: default }
    behaviour: A dialogue voice ducks Music by 8 dB and Effects by 4 dB, holds 0.25 s, recovers over 0.6 / 0.4 s.
    observed_by: "`SirenMix::ducked` per frame at 30 fps."
    green_when: Both ducks reach their depth within 50 ms; both read 0 dB at hold + fade + 50 ms.
    source: Gregory, Game Engine Architecture 3e, 14.6.3 (docs/research/siren.md).

  - id: 7
    cue: footstep.grass
    authored: { max_instances: 2 }
    behaviour: A third play takes the oldest back rather than sounding a third.
    observed_by: "Live `Voice` count and `SirenLog`."
    green_when: Two live voices; one entry whose reason starts "stolen by".

  - id: 8
    cue: engine.idle
    authored: { bus: Effects, bus_max_voices: 2, priority: 5, mode: Loop }
    behaviour: A bus cap holds when three requests arrive in one frame.
    observed_by: "Live `Voice` count and `SirenLog` after one frame."
    green_when: "Two voices live, one steal logged, and no third `Played` from that frame."

  - id: 9
    cue: dialogue.greeting
    authored: { bus: Dialogue, priority: 180, bus_full: true }
    behaviour: A voice a player is listening to is never stolen; the request is refused instead.
    observed_by: "`Refused` and the live count — and a **stealable** request of priority 0 against it, which must also be refused."
    green_when: Refusal::VoiceLimit, nothing spawned, the dialogue voice still live, and no `stolen by` line for it.
    source: Gregory §14.5.8.4 — unstealable "plays, even despite their priority settings"; UNSTEALABLE_PRIORITY, design default
    evidence: "tests/mix.rs::{an_unstealable_voice_is_never_taken_by_a_stealable_request, a_stealable_voice_plays_beside_an_unstealable_one}"

  - id: 10
    cue: footstep.snow
    authored: { in_table: false }
    behaviour: An unknown cue is refused by name.
    observed_by: "`Refused`."
    green_when: "Refusal::UnknownCue, no `Voice`, no `Played`."

  - id: 11
    cue: footstep.grass
    authored: { variant_key_without_handle: true }
    behaviour: A missing file is refused, naming the key.
    observed_by: "`Refused`."
    green_when: "Refusal::MissingSound whose `sound` is that key."

  - id: 12
    cue: bang
    authored: { bus: Reverb, bus_in_table: false }
    behaviour: An unknown bus is refused, never moved to Effects.
    observed_by: "`Refused`."
    green_when: Refusal::UnknownBus with bus "Reverb".

  - id: 13
    cue: bang
    authored: { spatial: true, position: true, listener: false }
    behaviour: A spatial play with no ears is refused, carrying the position.
    observed_by: "`Refused`."
    green_when: Refusal::SpatiallyMute at that position.

  - id: 14
    cue: bang
    authored: { spatial: true, attenuation: { inverse: { near_m: 4.0, rolloff: 1.0 } }, listener: true }
    behaviour: Distance decides the gain.
    observed_by: "`Played::gain_db` at 4 m and at 8 m."
    green_when: 0 dB at the near radius and -6.02 dB at twice it, each within 0.01.
    source: inverse-distance falloff; -6.02 dB is the amplitude ratio of 1/2.

  - id: 15
    cue: music.calm + music.combat
    authored: { score_layers: 2, tempo_bpm: 160.0, beats_per_bar: 4.0 }
    behaviour: A layer change lands on the bar, and a silent layer stays in the mix.
    observed_by: "`MusicState::target_db` per frame, and the live layer voices."
    green_when: The target moves on a multiple of 1.5 s, and both layers have a live voice throughout.
    source: 1.5 s is 4 beats at 160 bpm.

  - id: 16
    cue: music.stinger
    authored: { stinger: { duck_db: -9.0 } }
    behaviour: A stinger plays at once and ducks the music it plays over.
    observed_by: "`SirenMix::ducked(\"Music\")` on the frame of the stinger, and `SirenLog`."
    green_when: "-9.0 dB on that frame, and a Ducked entry whose `by` is \"stinger\"."
    source: design default for the depth; immediate is the stinger rule.

  - id: 17
    cue: any two cues
    authored: { seed: [7, 99], order: fixed, runs: 2 }
    behaviour: The same seed replays the same sounds, gains and pitches; two seeds are two streams.
    observed_by: "Two `Played` streams per seed, and the streams across seeds."
    green_when: Equal field for field within a seed, and different across seeds.
    evidence: "tests/play.rs::a_projects_seed_reaches_the_stream, changing_the_seed_restarts_the_stream"

  - id: 30
    cue: any
    authored: { stop: stale_handle, voice: ended }
    behaviour: A `StopVoice` for a voice the crate has already retired is a no-op, never a panic.
    observed_by: "`app.update()` after `StopVoice` for a despawned voice, and `SirenLog`."
    green_when: "The app updates, the world is unchanged, and nothing is logged as stopped."
    source: "crate rule R6 — a stop for a sound that stopped is not a decision; Bevy's default error handler panics on a despawned entity"
    evidence: "runs/2026-11-02-12/review.md, tests/play.rs::a_stop_for_an_ended_voice_is_a_no_op (panics on the unfixed tree)"

  - id: 29
    cue: any
    authored: { buses: [], then swapped to two }
    behaviour: The mix holds exactly the buses the table has this frame, and an empty list means the crate's four.
    observed_by: "`SirenMix::db`/`ducked` keys, `bus_db` of a removed bus, `deepest_duck`, and a play on `Effects` with `buses: []`."
    green_when: "Removed buses leave both maps, `bus_db` reads SILENT_DB, `deepest_duck` is None; `buses: []` gives the four at 0 dB and mixes a play there."
    source: "crate rule R6 — SirenMix is *this frame's* mix, one number per bus; `SirenSettings::bus_names()` is the one answer `answer` and the panel read"
    evidence: "runs/2026-11-02-10/review.md, tests/mix.rs::{a_bus_that_left_the_table_leaves_the_mix, an_empty_bus_list_still_means_the_crates_four}"

  - id: 28
    cue: music.does-not-exist
    authored: { stinger: { duck_db: -9.0, duck_s: 1.0 }, in_table: false }
    behaviour: A stinger that cannot play leaves the music untouched and says so once.
    observed_by: "`SirenMix::ducked(\"Music\")` on the frame, `Refused`, and `SirenLog`."
    green_when: "Music reads 0 dB; one `refused` line; no `stinger ducked` line anywhere."
    source: "Gregory §14.6.3 and crate rule R3 — a duck is driven by a voice that starts; crate rule R6 — two records of one request cannot disagree"
    evidence: "runs/2026-11-02-09/review.md, tests/music.rs::{a_stinger_whose_cue_is_unknown_ducks_nothing, a_stinger_whose_sound_is_missing_ducks_nothing}"

  - id: 27
    cue: ui.click
    authored: { spatial: false, position: [0.0, 0.0, 8.0], listener: true }
    behaviour: A non-spatial cue given a position is not routed through the panner.
    observed_by: "`Played.gain_db`, and the voice entity's `PlaybackSettings.spatial` and `Transform` on Bevy's path."
    green_when: "gain_db is the cue's own; no panner flag and no Transform; the same cue with `spatial: true` keeps both."
    source: "`Cue::spatial`'s doc; the crate's own rule that a play is never silently a different sound from the one asked for (docs/guide/spatial.md)"
    evidence: "runs/2026-11-02-08/review.md, tests/play.rs::a_non_spatial_cue_ignores_a_position, tests/model.rs::the_panner_law_is_what_a_spatial_cue_divides_out"

  - id: 26
    cue: any
    authored: { plays: [200, 400], mixer: real-device }
    behaviour: The crate's own mixer reuses a voice slot, and a reused slot is a new name.
    observed_by: "`MixerBackend::voices(bus)` after N one-shots that have all ended, and the set of indices handed out."
    green_when: "Slots bounded by the concurrent peak (6 for 400 plays), distinct indices == plays, and a stale index is a no-op."
    source: "Gregory §14.5.8.4 — a sound engine supports a **fixed** number of voices; crate rule R4 bounds the concurrent count"
    evidence: "runs/2026-11-02-07/perf.md, tests/mixer.rs::a_slot_is_reused_and_a_stale_index_addresses_nothing, tests/model.rs::a_voice_index_is_a_slot_and_a_generation"

  - id: 25
    cue: footstep.grass
    authored: { variant_key: step_03, bytes: undecodable }
    behaviour: A sample the decoder refuses is refused naming the sound key, not the cue.
    observed_by: "`Refused::reason` for a key whose bytes the mixer cannot decode."
    green_when: "`MissingSound { sound: \"step_03\" }`, never the cue's name; nothing plays."
    source: "`MissingSound::sound`'s doc, \"the key with no handle\"; Bevy's own split of not-found from failed-to-load (bevy_asset LoadState::Failed)"
    evidence: "runs/2026-11-02-06/evidence/{before,after}/missing-sound.txt, tests/mixer.rs::a_sample_the_decoder_refuses_names_its_sound_key"

  - id: 24
    cue: any
    authored: { caps: [table, cue, bus] }
    behaviour: A refusal names a bus only when that bus's own `max_voices` refused.
    observed_by: "`Refusal::VoiceLimit`'s payload and its sentence, for each of the three caps forced in turn."
    green_when: "Table or cue cap -> `bus: None` (\"no voice free\"); bus cap -> `bus: Some(name)`."
    source: "`VoiceLimit::bus`'s doc, \"the bus that had no room, when one did\"; Gregory §14.5.8.4 keeps a group's limit and the engine's apart"
    evidence: "runs/2026-11-02-05/evidence/{before,after}/refusals.txt, tests/mix.rs::{a_full_table_budget_names_no_bus, a_cue_at_its_own_polyphony_names_no_bus, a_full_bus_names_that_bus}"

  - id: 23
    cue: music.calm + music.combat
    authored: { score_layers: 2, tempo_bpm: 120.0, fade_s: 0.8, target_db: -9.0 }
    behaviour: A layer takes the fade it was given, and a fade of 0 keeps the crate's easing.
    observed_by: "`MusicState::layer_db` per frame, and `model::tau_for_fade` directly."
    green_when: "Still moving at `fade_s / 2`; within 0.01 dB by `fade_s`; `fade_s(0)` settles in ~150 ms."
    source: "`MusicLayers::fade_s`'s doc (\"how long the move takes\") and `Duck::fade_s` (the crate's meaning of a duration); the constant is derived, design default"
    evidence: "runs/2026-11-02-04/evidence/plots/layer-fade-zoom.svg, tests/music.rs::a_layer_takes_the_fade_it_was_given"

  - id: 22
    cue: music.stinger
    authored: { stinger: { duck_db: -9.0, duck_s: 0.6 } }
    behaviour: A stinger's duck holds for `duck_s` and then releases; the music does not swell back underneath it.
    observed_by: "`SirenMix::ducked(\"Music\")` at the frame it fires, halfway through the hold, and after hold + release."
    green_when: -9 dB on the fire frame, still -9 dB halfway, 0 dB by duck_s + DEFAULT_FADE_S + one frame.
    source: the crate's own `active_duck_db` shape (Gregory §14.6.3); 0.12 s release is `DEFAULT_FADE_S` (design default)
    evidence: "runs/2026-11-02-03/evidence/plots/stinger-envelope-zoom.svg, tests/music.rs::a_stinger_holds_the_music_back_for_its_whole_length"

  - id: 18
    cue: a broken table
    authored: { no_sounds: 1, duplicate: 1, unknown_bus: 1, inverted_pitch: 1 }
    behaviour: problems() names each mistake in a sentence.
    observed_by: "`CueTable::problems_with`."
    green_when: One sentence per mistake, each naming its cue.

  - id: 19
    cue: any
    authored: { voices: [8, 64, 256] }
    behaviour: The mix does not slow a case it did not target.
    observed_by: perf.md at the three voice counts, against the recorded baseline.
    green_when: Frame cost within 10 % of the baseline.

  - id: 20
    cue: footstep.grass
    authored: { mode: Once, priority: 0, max_instances: 0, bus_max_voices: 32, plays: 40 }
    behaviour: A voice that ends frees its slot, so a budget of 32 holds 40 played footsteps rather than filling up.
    observed_by: "`SirenMix::voices`, the `ended` entries in `SirenLog`, and the live `Voice` count after the run."
    green_when: 40 `Played`, no `VoiceLimit`, every ended voice logged `ended`, and the live count back to 0.
    source: Gregory §14.5.8.4 — a stopped voice *frees its resources for use by other voices*.
    evidence: "runs/2026-11-02-02/evidence/{before,after}/steady/, tests/mixer.rs::a_one_shot_voice_ends_and_frees_its_slot"

  - id: 21
    cue: dialogue.greeting
    authored: { mode: Once, priority: 180, max_instances: 0, bus_max_voices: 4, plays: 6 }
    behaviour: An unstealable one-shot that is never retired locks the budget; with the fix the sixth play is answered.
    observed_by: "`Refused` count and the live `Voice` count after six plays."
    green_when: 6 `Played`, no `VoiceLimit`, 6 `ended` lines, last-frame live count 0.
    source: Gregory §14.5.8.4 — the case where the leak cannot be hidden by a steal.
    evidence: "runs/2026-11-02-02/evidence/{before,after}/lockout/"

  - id: 31
    cue: any
    authored: { cue_gain: NaN, slot_gain: NaN, pitch: inverted, attenuation: negative }
    behaviour: Every number a cue author writes that the crate cannot honour is either reported by `problems()` or said out loud when it is neutralised at play time.
    observed_by: "`CueTable::problems()` for an inverted `pitch` range and a negative `attenuation`; `SirenLog` for a cue whose `gain_db` is `NaN` and a slot whose `gain_db` is `NaN`, played through a headless app."
    green_when: "Two sentences from `problems()` (`pitch`, `attenuation`) and one from the log naming both gains, which were read as the neutral value and the cue still played."
    source: "`CueProblem`'s vocabulary covers `pitch` and `attenuation`; a `CueProblem` variant for a gain is a breaking enum change, so `needs-decision/bad-gain-problem.md` recommends the log instead. Iteration 72 shipped option C: `Entry::Stopped`'s free-text `why` carries the sentence, so no public enum gains a variant."
    state: green
    evidence: "runs/2026-11-03-72/tests/neutralised.rs — `a_cue_gain_that_is_not_a_number_is_reported_beside_its_play"

# Two notes on judging.
#
# - A refusal is green when it is the *right* refusal. Cases 10-13 would pass vacuously if the crate refused
#   everything, so each is paired with a play that succeeds (5, 6, 14): a build that refuses too much is red there.
# - The numbers are the sources' numbers, not invented ones. 8 dB and 4 dB are Gregory's dialogue duck (Game Engine
#   Architecture 3e, 14.6.3); -6.02 dB is half amplitude; a bar at 160 bpm is 1.5 s. A case that needs a number no
#   source gives says `design default` and is argued in the iteration's research.md.

  - id: 32
    cue: engine.idle
    authored: { bus: Effects, mode: Loop, play: { on: owner, then: despawn_owner } }
    behaviour: A sound whose owner is despawned stops, and the log says which sound and why.
    observed_by: "`SirenLog`'s `Stopped` entry for the cue and `SirenMix::voices_on` after the despawn."
    green_when: "One entry whose `why` is \"owner despawned\" naming the cue; the bus counts one fewer voice; a game's own unparented despawn writes nothing."
    source: "`Play::on`'s doc — the parent's despawn is the ordinary end of such a sound; crate rule R6 — every play's outcome is readable"
    evidence: "runs/2026-11-03-43/review.md, tests/play.rs::a_despawned_owner_stops_its_sound_and_says_so, tests/mixer.rs::a_despawned_voices_mixer_slot_is_freed"

  - id: 33
    cue: track.combat
    authored: { score_layers: 2, max_voices: 1 }
    behaviour: A layer the budget refused is a virtual voice, and the state says so until it starts.
    observed_by: "`MusicState::blocked(layer)` before and after a voice frees."
    green_when: "`Some(n)` with `n` the live count at the refusal; `None` once that layer has a voice. A layer the score does not have answers `None`."
    source: "Gregory, Game Engine Architecture 3e §14.5.8 — `\"a virtual voice is a sound the game believes is playing but that has no hardware voice\"`"
    evidence: "runs/2026-11-03-44/review.md, tests/music.rs::a_refused_layer_start_is_tried_again_when_room_frees"
