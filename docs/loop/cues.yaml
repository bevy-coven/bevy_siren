# The cues this loop judges by.
#
# The fixed cases every iteration runs before it picks an item, and again after its change: the contract a game would
# write, in the crate's own words. Each case names the behaviour it should show, the observation that proves it, and
# how it is observed with no ear. `cues.yaml` is read by a person and, when a case is worth automating, by a test in
# `tests/cues.rs` — the fields here are the assertion.
#
# `green_when` is the assertion. `source` cites the number the case rests on, or says `design default`. A case that
# fails after a change is a failure of that iteration, whatever else it shipped.

cases:
  - id: 1
    cue: footstep.grass
    authored: { variants: 3, repeat: { avoid_repeat: 1 } }
    behaviour: Variants do not repeat back to back.
    observed_by: "64 plays, the `sound` of each `Played`."
    green_when: No two adjacent sounds are equal, and all three variants appear.

  - id: 2
    cue: footstep.stone
    authored: { variants: 2, repeat: { avoid_repeat: 4 } }
    behaviour: A window wider than the variant list still refuses the pick immediately before.
    observed_by: 8 plays.
    green_when: No two adjacent sounds are equal.

  - id: 3
    cue: gun.burst
    authored: { variants: 1, repeat: shuffle, pitch: exact }
    behaviour: A burst repeats one sample and does not vary its pitch.
    observed_by: "8 plays, `sound` and `pitch`."
    green_when: One distinct sound; every pitch equal to the authored one.

  - id: 4
    cue: footstep.grass
    authored: { pitch: { low: -1.0, high: 1.0 } }
    behaviour: Pitch jitter stays inside the authored range.
    observed_by: 64 plays.
    green_when: Every pitch in -1.0..=1.0, and at least two distinct values.

  - id: 5
    cue: ui.cancel
    authored: { gain_db: -6.0, bus: Effects, bus_gain_db: 0.0 }
    behaviour: A gain is the cue's own and its bus is the one it names.
    observed_by: "One `Played`, and `SirenMix` after it."
    green_when: gain_db == -6.0; bus == "Effects"; the mix holds the four default buses.
    source: The cue's gain is authored; 0 dB is full scale.

  - id: 6
    cue: dialogue.greeting
    authored: { bus: Dialogue, ducks: default }
    behaviour: A dialogue voice ducks Music by 8 dB and Effects by 4 dB, holds 0.25 s, recovers over 0.6 / 0.4 s.
    observed_by: "`SirenMix::ducked` per frame at 30 fps."
    green_when: Both ducks reach their depth within 50 ms; both read 0 dB at hold + fade + 50 ms.
    source: Gregory, Game Engine Architecture 3e, 14.6.3 (docs/research/siren.md).

  - id: 7
    cue: footstep.grass
    authored: { max_instances: 2 }
    behaviour: A third play takes the oldest back rather than sounding a third.
    observed_by: "Live `Voice` count and `SirenLog`."
    green_when: Two live voices; one entry whose reason starts "stolen by".

  - id: 8
    cue: engine.idle
